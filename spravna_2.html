<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
         <title>
        Juristické tajemství
        </title>

        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <link rel="stylesheet" href="style.css">
    </head>
     <body>
        <label for="answer">Rhalkyh chsrf Qhuh Rbkyuf</label>
        <input type="text" id="answer" name="answer">
        <button type="button" id="check-answer">Zkontrolovat</button>
        <p id="feedback" aria-live="polite"></p>
        <a id="next-page-link" href="spravna_3.html" hidden>Pokračovat</a>

        <script>
            const answerInput = document.getElementById("answer");
            const checkAnswerButton = document.getElementById("check-answer");
            const feedback = document.getElementById("feedback");
            const nextPageLink = document.getElementById("next-page-link");

            answerInput.addEventListener("input", () => {
                feedback.textContent = "";
                nextPageLink.hidden = true;
            });

            checkAnswerButton.addEventListener("click", () => {
                const isCorrect = answerInput.value === "Katedra valky Jana Kudrny" || answerInput.value === "Katedra války Jana Kudrny" || answerInput.value === "katedra valky jana kudrny" || answerInput.value === "katedra války jana kudrny";
                feedback.textContent = isCorrect ? "Správně" : "Špatně";
                nextPageLink.hidden = !isCorrect;
            });
        </script>
    </body>
    <footer>
        <p>© 2027 Juristi. Všechna práva vyhrazena.</p>
    </footer>
</html>
