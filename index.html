<!DOCTYPE html>
<html>
   
    
    <head>
        <meta charset="UTF-8">
         <title>
        Juristické tajemství
        </title>

        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <label for="answer">Rok založení Juristů + rok založení UK - počet Juristů na jarním teambuildingu</label>
        <input type="number" id="answer" name="answer">
        <p id="feedback" aria-live="polite"></p>

        <script>
            const answerInput = document.getElementById("answer");
            const feedback = document.getElementById("feedback");

            answerInput.addEventListener("input", () => {
                feedback.textContent = answerInput.value === "3337" ? "Správně" : "Špatně";
            });
        </script>
    </body>
</html>
